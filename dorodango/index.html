<style>
/* 校庭の砂場、夏の午後。下は方眼ノートの操作パネル。単一の世界観なのでテーマは固定 */
:root{
  --sky:#bcdde9; --haze:#e6f2f2; --sand:#e4cc98; --sand-deep:#c8a66a;
  --ink:#2b1d13; --ink-soft:#6f5a47; --paper:#fffaf0; --grid:rgba(60,110,150,.11);

  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html{height:100%;background:linear-gradient(var(--sky) 50%,var(--paper) 50%)}
body{height:100%;margin:0;overflow:hidden;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

.brand{font-family:var(--f-display);font-size:16px;letter-spacing:.02em;white-space:nowrap}
.steps{display:flex;gap:3px;margin:0;padding:0;list-style:none}
.steps li{width:20px;height:20px;font-size:11px!important;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  border:1.5px solid var(--ink-soft);color:var(--ink-soft);background:transparent}
.steps li.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.steps li.now{background:var(--hat);border-color:var(--ink);color:var(--hat-ink)}
#stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;touch-action:none;
  background:linear-gradient(180deg,var(--sky) 0%,var(--haze) 67%,var(--sand) 67.4%,var(--sand-deep) 100%)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;
  background:rgba(255,250,240,.88);border:1.5px solid var(--ink);font-family:var(--f-display);font-size:14px;
  white-space:nowrap;pointer-events:none;transition:opacity .4s}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;
  font-family:var(--f-display);font-size:26px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);
  padding:10px 18px;border-radius:16px;box-shadow:0 4px 0 var(--ink);transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#panel{margin-top:10px;padding:14px 16px 16px;border-radius:18px 18px 0 0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.ask{margin:0;font-family:var(--f-display);font-size:16px;line-height:1.5;text-wrap:balance}
.sub{margin:0;font-size:14px;color:var(--ink-soft);font-weight:700}
.sub b{color:var(--ink)}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);
  font-size:16px;padding:10px 12px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;text-decoration:none;transition:transform .06s,box-shadow .06s}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--hat);color:var(--hat-ink)}
.btn.blue{background:var(--water);color:#fff}
.btn:focus-visible,.soil:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.meter{height:12px;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--hat);transition:width .1s linear}
.meter.sun i{background:#e8873a}

.soil:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.res-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tier{font-family:var(--f-display);font-size:13px;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--paper)}
.tier.top{background:var(--hat);color:var(--hat-ink);border:1.5px solid var(--ink)}
.tier.rare{background:var(--rare);color:#fff}
.soil-tag{font-size:13px;color:var(--ink-soft);font-weight:700}
.res-name{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.25;text-wrap:balance}

.hbtn:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.hright{display:flex;align-items:center;gap:8px;min-width:0}
#panel.result{max-height:64%;overflow-y:auto}

.score{font-family:var(--f-display);font-size:44px;line-height:1}
.unit{font-family:var(--f-display);font-size:18px}
.bd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bd div{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--ink-soft)}

.reg{display:flex;gap:8px}
.reg input{flex:1;min-width:0;font-family:var(--f-body);font-weight:700;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.reg input:focus-visible{outline:3px solid var(--water);outline-offset:1px}
.reg .btn{flex:0 0 auto}
.msg{margin:0;font-size:13px;font-weight:700;color:var(--ink-soft);min-height:1em}
.msg.err{color:#b3261e}
.rank-title{margin:0;font-family:var(--f-display);font-size:20px;font-weight:400}
.rank-mode{margin:0;font-size:12px;font-weight:700;color:var(--ink-soft)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.rank li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 4px;border-bottom:1px dashed rgba(43,29,19,.2)}
.legend{border-top:2px solid var(--ink);padding-top:8px}.legend h3{margin:0 0 4px;font-family:var(--f-display);font-size:13px}.legend p{margin:0;font-size:13px;font-weight:700;line-height:1.7;overflow-wrap:anywhere}.rank li.me{background:rgba(245,197,24,.28);border-radius:8px}
.rank .no{font-family:var(--f-display);font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.rank li:nth-child(1) .no{color:#b8860b}
.rank .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rs{grid-column:2;font-size:12px;color:var(--ink-soft);font-weight:700}
.rank .sc{grid-column:3;grid-row:1/3;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(43,29,19,.6);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;max-height:100%}
.sheet img{width:100%;height:auto;border-radius:10px;min-height:0;object-fit:contain;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.sheet p{margin:0;font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center}
.err{margin:auto;padding:24px;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
/* 公開したらここにゲームのURLを入れる(Xのシェア文にリンクが付く) */
const GAME_URL = 'https://amazing-dusk-b8e52b.netlify.app/dorodango/';

/* 手ざわりの長さ。丸めは8周、磨きは約30回なぞると満タン */
const ROUND_LAPS = 8, POLISH_RATE = .00014, OVERRUB = 27000, SAND_SPIN = .75, INERTIA = .965;

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

if(!window.THREE){ $('#panel').innerHTML='<p class="err">3D表示を読み込めませんでした。通信状態を確認して、ページを開き直してください。</p>'; return; }

const SOILS = {
  black:{name:'黒土',   color:'#3b2a1f', cap:1.0,  tol:0.08, desc:'よく光る。でも気難しい'},
  red:  {name:'赤土',   color:'#8c4b2c', cap:0.9,  tol:0.12, desc:'ほどよく素直'},
  sandy:{name:'砂混じり',color:'#9d8562', cap:0.72, tol:0.18, desc:'やさしい。光りにくい'}
};
const RESULTS = {
  maboroshi:{tier:'幻', cls:'top', name:'幻の泥団子', comment:'待った時間が、そのまま光になった。ほんの一握りしか見たことがない'},
  mirror:{tier:'最上', cls:'top', name:'幻の鏡面泥団子', comment:'空が映ってる。これ、本当に泥?'},
  black: {tier:'上',   cls:'top', name:'黒光りの玉',     comment:'黒く光る。クラスで一番のやつ'},
  pika:  {tier:'上',   cls:'',    name:'ピカピカ泥団子', comment:'先生に見せたくなる仕上がり'},
  tsuya: {tier:'中',   cls:'',    name:'ツヤあり泥団子', comment:'ちゃんと光ってる。形はちょっといびつ'},
  tsuru: {tier:'中',   cls:'',    name:'つるつる泥団子', comment:'形は満点。あと少し磨けば光る'},
  normal:{tier:'中',   cls:'',    name:'ふつうの泥団子', comment:'ちゃんと泥団子。それでいい'},
  zara:  {tier:'下',   cls:'',    name:'ざらざら泥団子', comment:'砂場の味がする'},
  crack: {tier:'下',   cls:'',    name:'ひび割れ泥団子', comment:'水が足りなかった。日照りの田んぼみたい'},
  mud:   {tier:'珍',   cls:'rare',name:'泥水',           comment:'団子だったもの'},
  drill: {tier:'珍',   cls:'rare',name:'ドリル泥団子',   comment:'どうしてこうなった。回転力はある'},
  fossil:{tier:'珍',   cls:'rare',name:'化石泥団子',     comment:'1億年前の地層から出てきた'}
};
const RESULT_ORDER = ['maboroshi','mirror','black','pika','tsuya','tsuru','normal','zara','crack','mud','drill','fossil'];
/* 結果ごとの見た目: 色の明るさ, 粗さ, 凹凸, クリアコート, 映り込み, ゆがみ, 磨き */
const LOOKS = {
  maboroshi:[.8,.0,0,1,2.6,.0,1], mirror:[.40,.02,0,1,1.8,.004,1], black:[.48,.06,.05,.9,1.35,.01,1], pika:[.6,.13,.15,.7,1.2,.015,1],
  tsuya:[.64,.18,.2,.6,1.1,.13,.9], tsuru:[.88,.55,.45,0,1,.012,.35], normal:[.9,.72,.8,0,1,.06,.4],
  zara:[1.05,.95,2.2,0,1,.08,0], crack:[1.08,.95,1.6,0,1,.06,.1], mud:[.55,.1,.15,.6,1.2,.02,0],
  drill:[.62,.25,.5,.3,1.1,0,.6], fossil:[1,1,2.6,0,.8,.1,0]
};

/* ---------- state ---------- */
let S;
function newState(){
  S = {step:0, soil:'red', round:0, roundProg:0, angAcc:0, radii:[], lastAng:null, lastDir:0, reversals:0,
       water:0.20, waterT:[], wEma:null, wS:[], scv:null, sand:new Array(12).fill(0), holding:false, dry:0, polish:0, scratch:0, overRub:0, cover:new Array(36).fill(0), sweetD:0, totD:0,
       crack:0, stone:false, collapsed:false, result:null, lump:0.36, finalLump:0.36, mudT:0, touched:false, fullNotice:false};
}
newState();

/* ---------- three ---------- */
const stage = $('#stage'), gl = $('#gl'), fx = $('#fx'), fctx = fx.getContext('2d');
const renderer = new THREE.WebGLRenderer({canvas:gl, antialias:true, alpha:true, preserveDrawingBuffer:true});
const DPR = Math.min(2, window.devicePixelRatio || 1);
renderer.setPixelRatio(DPR);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 60);

(function env(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#4fa6e0'); g.addColorStop(.47,'#eaf6ff'); g.addColorStop(.5,'#d9bf8c'); g.addColorStop(1,'#6e4e30');
  x.fillStyle = g; x.fillRect(0,0,1024,512);
  x.fillStyle = '#ffffff'; x.fillRect(170,120,170,90); x.fillRect(372,130,70,70);
  x.fillStyle = '#fff6cf'; x.beginPath(); x.arc(700,90,38,0,7); x.fill();
  x.fillStyle = '#5f8f4e'; for(let i=0;i<14;i++){ x.beginPath(); x.arc(520+i*34,236,22+(i%3)*6,0,7); x.fill(); }
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromEquirectangular(t).texture;
})();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a6a4a, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-3,4,4); scene.add(key);

/* textures */
const TW = 512, TH = 256, rnd = mulberry32(42);
const tc = document.createElement('canvas'); tc.width = TW; tc.height = TH; const tx = tc.getContext('2d');
const SPECK = Array.from({length:5200}, () => [rnd()*TW, rnd()*TH, rnd(), 1+rnd()*2.4]);
const DUST = Array.from({length:12}, (_,i) => Array.from({length:700}, () => [((i+rnd())*TW/12 + (rnd()-.5)*16 + TW) % TW, rnd()*TH, 1+rnd()*1.6]));
const CRACKS = [];
for(let k=0;k<16;k++){
  let x0 = rnd()*TW, y0 = 40+rnd()*(TH-80), a = rnd()*Math.PI*2; const pl = [[x0,y0]];
  const n = 5+Math.floor(rnd()*7);
  for(let j=0;j<n;j++){ a += (rnd()-.5)*1.4; x0 += Math.cos(a)*(8+rnd()*14); y0 += Math.sin(a)*(8+rnd()*14); pl.push([x0,y0]); }
  CRACKS.push(pl);
}
const colorTex = new THREE.CanvasTexture(tc); colorTex.encoding = THREE.sRGBEncoding; colorTex.anisotropy = 4;
const bc = document.createElement('canvas'); bc.width = 512; bc.height = 256; const bx = bc.getContext('2d');
bx.fillStyle = '#808080'; bx.fillRect(0,0,512,256);
for(let i=0;i<14000;i++){ const v = Math.floor(rnd()*255), s = 1+rnd()*2.5; bx.fillStyle = 'rgba('+v+','+v+','+v+',.7)'; bx.fillRect(rnd()*512, rnd()*256, s, s); }
const bumpTex = new THREE.CanvasTexture(bc);

function drawTex(){
  const sl = SOILS[S.soil];
  tx.fillStyle = S.stone ? '#a59b8b' : sl.color; tx.fillRect(0,0,TW,TH);
  for(const [x,y,v,s] of SPECK){
    tx.fillStyle = v < .5 ? 'rgba(0,0,0,'+(.1+v*.22)+')' : 'rgba(255,240,215,'+((v-.5)*.22)+')';
    tx.fillRect(x,y,s,s);
  }
  if(!S.stone){
    const fade = 1 - Math.min(1, S.polish)*.85;
    for(let i=0;i<12;i++){
      const a = Math.min(1.6, S.sand[i]); if(a <= 0) continue;
      tx.fillStyle = 'rgba(222,200,156,'+(Math.min(1,a/1.6)*.45*fade)+')';
      tx.fillRect(i*TW/12-4, 0, TW/12+8, TH);
      tx.fillStyle = 'rgba(242,226,192,'+(.75*fade)+')';
      const L = DUST[i], n = Math.floor(a/1.6*700);
      for(let j=0;j<n;j++) tx.fillRect(L[j][0], L[j][1], L[j][2], L[j][2]);
    }
  }

const DIRS = Array.from({length:7}, () => ({v:new THREE.Vector3(rnd()*2-1, rnd()*2-1, rnd()*2-1).normalize(), ph:rnd()*6.28, f:2+rnd()*3}));
function fixNormals(){
  const n = geo.attributes.normal.array, W = WS+1;
  for(let r=0;r<=HS;r++){ const a = r*W*3, b = (r*W+WS)*3;
    let x = n[a]+n[b], y = n[a+1]+n[b+1], z = n[a+2]+n[b+2], l = Math.hypot(x,y,z)||1;
    n[a]=n[b]=x/l; n[a+1]=n[b+1]=y/l; n[a+2]=n[b+2]=z/l; }
  for(const r of [0,HS]){ let x=0,y=0,z=0; for(let c=0;c<W;c++){ const j=(r*W+c)*3; x+=n[j]; y+=n[j+1]; z+=n[j+2]; }
    const l = Math.hypot(x,y,z)||1; for(let c=0;c<W;c++){ const j=(r*W+c)*3; n[j]=x/l; n[j+1]=y/l; n[j+2]=z/l; } }

}
function shape(mode, amt){
  const p = geo.attributes.position.array;
  for(let i=0;i<p.length;i+=3){
    const x = base[i], y = base[i+1], z = base[i+2];
    if(mode === 'drill'){
      const t = (y+1)/2, a = Math.atan2(z,x);
      const r = (1 - t*.88) * (1 + .2*Math.sin(a*3 + t*14));
      const rr = Math.hypot(x,z)*r*1.12, na = a + t*Math.PI*3;

    } else {
      let d = 0; for(const D of DIRS) d += Math.sin(D.f*(x*D.v.x + y*D.v.y + z*D.v.z) + D.ph);
      const k = 1 + d/DIRS.length*amt;
      p[i] = x*k; p[i+1] = y*k; p[i+2] = z*k;

}

/* ---------- scoring ---------- */
const sl = () => SOILS[S.soil];
/* 採点はきびしめ: 各項目のズレに強く反応させ、合計を2乗で絞る */
/* 各項目に「満点の幅」を持たせる(100点=上手。そこから先は精度ボーナスで上限なしに伸びる) */
function tempoCv(){
  const t = S.waterT; if(t.length < 3) return null;
  const iv = t.slice(1).map((v,i) => v - t[i]), m = iv.reduce((a,b)=>a+b,0)/iv.length;
  return Math.sqrt(iv.reduce((a,b)=>a+(b-m)*(b-m),0)/iv.length)/m;
}
function waterScore(){
  const d = Math.max(0, Math.abs(S.water-.55) - .012), tc = tempoCv();
  return clamp(100 - d/sl().tol*75, 0, 100) * (tc == null ? 1 : 1 - clamp((tc-.15)*.5, 0, .3));
}
function sandScore(){
  const m = S.sand.reduce((a,b)=>a+b,0)/12; if(m <= 0) return 0;
  const sd = Math.sqrt(S.sand.reduce((a,b)=>a+(b-m)*(b-m),0)/12);
  return .5*clamp(100-Math.max(0,Math.abs(m-1)-.05)*140,0,100) + .5*clamp(100-Math.max(0,sd/m-.07)*280,0,100);
}
function patienceScore(){ const d = S.dry; return d < .95 ? clamp(100-(.95-d)*300,0,100) : d <= 1.1 ? 100 : clamp(100-(d-1.1)*200,0,100); }
/* 磨きのムラ: 玉を6x6のマスに分け、円の内側24マスにどれだけ均等に当たったか */
const CELLS = []; for(let j=0;j<6;j++) for(let i=0;i<6;i++){ const cx=(i+.5)/3-1, cy=(j+.5)/3-1; if(Math.hypot(cx,cy) <= .86) CELLS.push(j*6+i); }
function polishUcv(){
  const v = CELLS.map(i => S.cover[i]), m = v.reduce((a,b)=>a+b,0)/v.length; if(m < 1) return null;
  return Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/v.length)/m;
}
function sweetRatio(){ return S.totD > 200 ? S.sweetD/S.totD : null; }
function polishScore(){
  const u = polishUcv(), sr = sweetRatio();
  const pen = (u == null ? 0 : Math.max(0, u-.4)*45) * S.polish + (sr == null ? 0 : Math.max(0, .7-sr)*30) * S.polish;
  return clamp(S.polish*100 - Math.max(0, S.scratch-.008)*160 - pen, 0, 100);
}
/* 精度ボーナス: 満点の幅の「内側」でどれだけ正確かを対数で加点。上限なし(人の手の限界まで伸びる) */
const bp = (e,d) => Math.max(0, Math.log(d/Math.max(e, d*0.01)));
function bonusRaw(noPolish){
  const m = S.sand.reduce((a,b)=>a+b,0)/12; if(m <= 0) return 0;
  const sd = Math.sqrt(S.sand.reduce((a,b)=>a+(b-m)*(b-m),0)/12);
  const r = bp(S.cv==null?1:S.cv,.04), q = (bp(S.scratch,.008)*.5 + (polishUcv()==null?0:bp(polishUcv(),.4))*.3 + (sweetRatio()==null?0:bp(Math.max(0,1-sweetRatio()),.3))*.2), w = bp(Math.abs(S.water-.55),.012),
        sa = (bp(Math.abs(m-1),.05)+bp(sd/m,.07))/2, pt = bp(Math.abs(S.dry-1.025),.075);
  const sp = S.scv == null ? 0 : bp(S.scv,.25), tp = tempoCv() == null ? 0 : bp(tempoCv(),.15);
  return 40*(r*.24+sp*.08+(noPolish?0:q*.22)+w*.12+tp*.09+sa*.13+pt*.12);
}
const SOIL_MULT = {black:1, red:.93, sandy:.85};
const FAIL_MULT = {mud:.1, drill:.25, fossil:.3, crack:.45};
/* 磨き以外の点数(幻の泥団子の条件に使う) */
function nonPolishScore(){
  const raw = (S.round*.25 + waterScore()*.15 + sandScore()*.15 + patienceScore()*.15)/.70*SOIL_MULT[S.soil], f = clamp(raw,0,100)/100;
  return 100*Math.pow(f,2) + bonusRaw(true)*Math.pow(f,8);
}
/* 磨く前の放置時間で、朝→夕方→夜と背景が変わる */
const SKY = [
  {t:0,  c:['#bcdde9','#e6f2f2','#e4cc98','#c8a66a']},
  {t:.5, c:['#6e5a9c','#f4a468','#c9945a','#8f5f36']},
  {t:1,  c:['#070d26','#1b2a58','#3a3a4c','#25232f']}
];
const hx = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
let skyT = -1;
function setSky(t){
  t = clamp(t,0,1); if(Math.abs(t - skyT) < .003) return; skyT = t;
  const i = t < .5 ? 0 : 1, a = SKY[i], b = SKY[i+1], k = (t - a.t)/(b.t - a.t);
  const col = a.c.map((c0,j) => { const x = hx(c0), y = hx(b.c[j]); return 'rgb('+x.map((v,n) => Math.round(v+(y[n]-v)*k)).join(',')+')'; });
  stage.style.background = 'linear-gradient(180deg,'+col[0]+' 0%,'+col[1]+' 67%,'+col[2]+' 67.4%,'+col[3]+' 100%)';
}
function computeScore(k){
  const p = {R:S.round, W:waterScore(), Sd:sandScore(), P:patienceScore(), Q:polishScore()};
  const raw = (p.R*.25 + p.W*.15 + p.Sd*.15 + p.P*.15 + p.Q*.30) * SOIL_MULT[S.soil];
  S.parts = p;
  const base = 100*Math.pow(clamp(raw,0,100)/100, 2.0)*(FAIL_MULT[k]||1);
  S.bonus = FAIL_MULT[k] ? 0 : bonusRaw()*Math.pow(clamp(raw,0,100)/100, 8);
  S.score = Math.round((base + S.bonus)*10)/10;
}
function judge(){
  const s = sl(), R = S.round, W = waterScore(), Sd = sandScore(), P = patienceScore(), Q = polishScore(), shine = Q*s.cap;
  if(S.collapsed || S.water > .55 + 2.5*s.tol) return 'mud';
  if(R < 20) return 'drill';
  if(S.dry > 1.6 || S.overRub > OVERRUB) return 'fossil';
  if(S.water < .55 - 2.2*s.tol) return 'crack';
  if(S.waited && Q >= 60 && nonPolishScore() >= 100) return 'maboroshi';
  const avg = (R+W+Sd+P+Q)/5;
  if(s.cap >= .95 && Math.min(R,W,Sd,P,Q) >= 85 && shine >= 95) return 'mirror';
  if(shine >= 80 && R >= 70) return 'black';
  if(avg >= 72 && shine >= 60) return 'pika';
  if(shine >= 60 && R < 70) return 'tsuya';
  if(Sd < 35 || shine < 25) return 'zara';
  if(R >= 70 && shine < 55) return 'tsuru';
  return 'normal';
}

/* ---------- look during play ---------- */
function look(){

    mat.roughness = L[1]; mat.bumpScale = L[2]; mat.clearcoat = L[3]; mat.envMapIntensity = L[4];
    return;
  }
  const s = sl(), dryK = Math.min(1, S.dry);
  const wet = S.step >= 2 ? S.water*(1-dryK) : .3*(1-dryK);
  const k = Math.pow(S.polish, 1.15)*s.cap;
  let m = (1 - wet*.55) * (1 + dryK*.18) * (1 - k*.45);
  mat.color.setScalar(m);

  rough = Math.min(rough, .95 - wet*.62);

  mat.bumpScale = (1-k)*(1.6 - wet*1.1) + S.scratch*1.2;
  mat.clearcoat = clamp((k-.4)/.6, 0, 1);
  mat.envMapIntensity = 1 + k*.3;
  const ex = S.step >= 2 && S.step < 6 ? Math.max(0, (S.water-.68)/.3) : 0;

  ball.position.y = ball.scale.y - 1;
}

/* ---------- particles ---------- */
const parts = [];
function spawn(o){ parts.push(Object.assign({vx:0, vy:0, g:0, life:1, decay:1.5, size:3, color:'#fff', type:'dot'}, o)); }
function star(c, x, y, s){ c.beginPath(); c.moveTo(x,y-s); c.quadraticCurveTo(x,y,x+s,y); c.quadraticCurveTo(x,y,x,y+s); c.quadraticCurveTo(x,y,x-s,y); c.quadraticCurveTo(x,y,x,y-s); c.fill(); }
function drawFx(dt){
  fctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.clearRect(0,0,fx.width,fx.height);
  const c = ballScreen();
  if(S.step === 1){
    fctx.lineWidth = 6; fctx.lineCap = 'round';
    fctx.strokeStyle = 'rgba(255,250,240,.7)'; fctx.beginPath(); fctx.arc(c.x, c.y, c.r*1.22, 0, 7); fctx.stroke();
    fctx.strokeStyle = '#f5c518'; fctx.beginPath(); fctx.arc(c.x, c.y, c.r*1.22, -Math.PI/2, -Math.PI/2 + S.roundProg*Math.PI*2); fctx.stroke();
  }
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.decay*dt;
    if(p.stopY != null && p.y >= p.stopY){
      if(p.type === 'drop') for(let k=0;k<3;k++) spawn({x:p.x, y:p.stopY, vx:(Math.random()-.5)*120, vy:-60-Math.random()*60, g:500, size:2, color:'rgba(120,180,230,.9)', decay:3});
      parts.splice(i,1); continue;
    }
    if(p.life <= 0){ parts.splice(i,1); continue; }
    fctx.globalAlpha = Math.min(1, p.life);
    fctx.fillStyle = p.color;
    if(p.type === 'star') star(fctx, p.x, p.y, p.size*(.6+.4*Math.min(1,p.life)));
    else if(p.type === 'drop'){ fctx.beginPath(); fctx.ellipse(p.x, p.y, p.size*.7, p.size, 0, 0, 7); fctx.fill(); }
    else fctx.fillRect(p.x, p.y, p.size, p.size);
  }
  fctx.globalAlpha = 1;
}

        msg.textContent = '登録中…';
        const res = await register(name.slice(0,10), key);
        msg.textContent = res;
        if(!/^(世界|自己ベスト)/.test(res)){ S.registered = false; $('#regB').disabled = false; }
      });
    }}
];
function updWater(){
  const w = S.water, el = $('#wl'); if(!el) return;
  el.textContent = w < .3 ? 'パサパサ' : w < .45 ? 'ちょっと乾いてる' : w <= .65 ? 'しっとり' : w <= .8 ? 'ゆるい' : 'べちゃべちゃ';
}
function shareUrl(){
  const R = RESULTS[S.result];
  const text = '泥団子をつくったら '+S.score.toFixed(1)+'点「'+R.name+'」になった('+SOILS[S.soil].name+')\n'+R.comment+'\n#ピカピカ泥団子';
  return 'https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+(GAME_URL ? '&url='+encodeURIComponent(GAME_URL) : '');
}

/* ---------- step logic ---------- */
function finishRound(){
  const R = S.round;
  toast(R >= 80 ? 'まんまる!' : R >= 50 ? 'まあまあ丸い' : R >= 20 ? 'ちょっといびつ' : 'なんか、ねじれた?');
  setTimeout(() => goStep(2), 900);
}
function collapse(){
  if(S.collapsed) return;
  S.collapsed = true; toast('あっ、崩れた…', 1400);
  setTimeout(() => showResult('mud'), 600);
}
function finish(){ showResult(judge()); }
function showResult(k, forced){
  S.result = k; S.holding = false; if(k === 'maboroshi') setSky(1);
  if(forced == null) computeScore(k);
  else { S.score = forced; S.forced = true; S.parts = {R:80,W:75,Sd:70,P:85,Q:90}; }
  const L = LOOKS[k];
  S.polish = L[6]; S.crack = (k === 'crack') ? 1 : (k === 'fossil') ? .8 : 0; S.stone = (k === 'fossil');
  if(k === 'mud') S.sand.fill(0);
  if(k === 'zara') S.sand = S.sand.map(v => Math.max(v, 1.3));
  ball.quaternion.identity(); ball.scale.set(1,1,1); ball.position.y = 0;
  if(k === 'drill') shape('drill'); else shape('lump', L[5]);
  S.mudT = 0; texDirty = true;
  goStep(6);
}
function restart(){ newState(); ball.quaternion.identity(); ball.scale.set(1,1,1); ball.position.y = 0; parts.length = 0; shapeDirty = true; texDirty = true; goStep(0); }

/* ---------- pointer on stage ---------- */
const AX = new THREE.Vector3(1,0,0), AY = new THREE.Vector3(0,1,0), AZ = new THREE.Vector3(0,0,1);
let down = false, lx = 0, ly = 0, lt = 0, vx = 0, vy = 0;
function spin(dx, dy){ ball.rotateOnWorldAxis(AY, dx*.012); ball.rotateOnWorldAxis(AX, dy*.012); }
function local(e){ const b = stage.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  down = true; const p = local(e); lx = p.x; ly = p.y; lt = performance.now(); vx = vy = 0;
  try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  if(S.step === 3){ S.holding = true; fadeHint(); }
  if(S.step === 4){ if(S.dry < .6) collapse(); else toast('もう固まってきてる'); }
});
stage.addEventListener('pointermove', e => {
  if(!down) return;
  const p = local(e), now = performance.now(), dx = p.x-lx, dy = p.y-ly, dtm = Math.max(1, now-lt);
  lx = p.x; ly = p.y; lt = now;
  if(S.step === 0 || S.step === 6){ if(S.result !== 'mud') spin(dx, dy); vx = dx; vy = dy; return; }
  if(S.step === 1){
    const c = ballScreen(), ox = p.x-c.x, oy = p.y-c.y, r = Math.hypot(ox, oy);
    if(r < c.r*.25){ S.lastAng = null; return; }
    if(!S.touched){ S.touched = true; fadeHint(); }
    const a = Math.atan2(oy, ox);
    if(S.lastAng != null){
      let d = a - S.lastAng; if(d > Math.PI) d -= 2*Math.PI; if(d < -Math.PI) d += 2*Math.PI; d = clamp(d, -.6, .6);
      const dir = Math.sign(d);
      if(dir && S.lastDir && dir !== S.lastDir && Math.abs(d) > .03) S.reversals++;
      if(dir) S.lastDir = dir;
      S.angAcc += Math.abs(d); ball.rotateOnWorldAxis(AZ, -d);
      if(Math.abs(d) > .004 && dtm < 80){
        const w = Math.abs(d)/dtm; S.wEma = S.wEma == null ? w : S.wEma*.88 + w*.12;
        S.wS.push(S.wEma); if(S.wS.length > 600) S.wS.shift();
        if(S.wS.length > 55){ const q = S.wS.slice(15), qm = q.reduce((a,b)=>a+b,0)/q.length;
          S.scv = Math.sqrt(q.reduce((a,b)=>a+(b-qm)*(b-qm),0)/q.length)/qm; }
      }
    }
    S.lastAng = a; S.radii.push(r/c.r); if(S.radii.length > 600) S.radii.shift();
    const n = S.radii.length, m = S.radii.reduce((x,y)=>x+y,0)/n, sd = Math.sqrt(S.radii.reduce((x,y)=>x+(y-m)*(y-m),0)/n);
    const cv = m ? sd/m : 1; S.cv = cv;
    S.round = clamp(100 - Math.max(0, cv-.04)*560 - Math.max(0, S.reversals-1)*4 - Math.max(0, (S.scv == null ? 0 : S.scv) - .25)*70, 0, 100);
    S.roundProg = Math.min(1, S.angAcc/(Math.PI*2*ROUND_LAPS));
    S.finalLump = (1 - S.round/100)*.22;
    S.lump = .36*(1-S.roundProg) + S.finalLump*S.roundProg; shapeDirty = true;
    const m1 = $('#m1'), s1 = $('#s1');
    if(m1) m1.style.width = Math.round(S.roundProg*100)+'%';
    if(s1) s1.textContent = S.roundProg < .35 ? 'まだゴツゴツ' : S.roundProg < .75 ? 'だんだん丸く' : 'あと少し';
    if(S.roundProg >= 1 && !S.roundDone){ S.roundDone = true; down = false; finishRound(); }
    return;
  }
  if(S.step === 5){
    if(!S.touched){ S.touched = true; fadeHint(); }
    if(!S.polishStarted){ S.polishStarted = true; { const wt = performance.now() - S.t5; S.waited = wt >= 150000 && wt <= 210000; } }
    spin(dx, dy); vx = dx; vy = dy;
    const dist = Math.hypot(dx, dy), speed = dist/dtm;
    /* 力加減: ちょうどいい速さ(0.6〜1.6px/ms)だと磨きが進み、遅すぎ・速すぎると効きが落ちる */
    const gain = speed < .6 ? .35 + .65*speed/.6 : speed <= 1.6 ? 1 : Math.max(.5, 1 - (speed-1.6)*.5);
    S.totD += dist; if(speed >= .6 && speed <= 1.6) S.sweetD += dist;
    { const bc = ballScreen(), ox = (p.x-bc.x)/bc.r, oy = (p.y-bc.y)/bc.r;
      if(Math.hypot(ox,oy) <= 1){ const ci = Math.min(5, Math.floor((ox+1)/2*6)), cj = Math.min(5, Math.floor((oy+1)/2*6)); S.cover[cj*6+ci] += dist; } }
    if(speed > 2.2 && dist > 24){ S.scratch = Math.min(.6, S.scratch + .006); if(Math.random() < .08) toast('強すぎ! キズになる', 800); }
    if(S.polish >= 1){ S.overRub += dist; if(!S.fullNotice){ S.fullNotice = true; toast('もう十分ピカピカ', 1200); }
      if(S.overRub > OVERRUB && !S.fossilNotice){ S.fossilNotice = true; toast('こすりすぎて、カチカチに…', 1400); } }
    S.polish = Math.min(1, S.polish + dist*gain*POLISH_RATE);
    texDirty = true;
    if(S.polish > .5 && Math.random() < .35) spawn({type:'star', x:p.x+(Math.random()-.5)*30, y:p.y+(Math.random()-.5)*30, size:5+Math.random()*5, decay:2.2, color:'#ffffff'});
    const v = polishScore()*sl().cap, m5 = $('#m5'), s5 = $('#s5');
    if(m5) m5.style.width = Math.round(S.polish*100)+'%';
    if(s5) s5.textContent = v < 20 ? 'ざらざら' : v < 45 ? 'ふつう' : v < 70 ? 'ツヤあり' : v < 90 ? '黒光り' : '鏡面';
  }
});
function up(){ down = false; S.lastAng = null; if(S.step === 3) S.holding = false; }
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);

/* ---------- ranking ---------- */
const RANK_KEY = 'dorodango-rank-v1', NAME_KEY = 'dorodango-name';
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(_){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
const PID_KEY = 'dorodango-pid';
let sharedRows = null, myId = null, legends = null;
function getPid(){
  let p = lsGet(PID_KEY, '');
  if(!/^[a-z0-9-]{8,40}$/i.test(p)){
    p = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'p' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    lsSet(PID_KEY, p);
  }
  return p;
}
myId = getPid().slice(0, 8);
function localRows(){ const L = lsGet(RANK_KEY, []); return Array.isArray(L) ? L : []; }
function renderRank(){
  const list = $('#rankList'); if(!list) return;
  const shared = !!sharedRows;
  const rows = (shared ? sharedRows : localRows()).slice(0, 10);
  $('#rankMode').textContent = shared ? '世界ランキング(1人につき自己ベスト1件)' : 'この端末のランキング(通信できませんでした)';
  list.textContent = '';
  rows.forEach((r, i) => {
    const li = document.createElement('li');
    if(shared ? r.id === myId : r.mine) li.className = 'me';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = i+1;
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = String(r.name || '名無し').slice(0,10);
    const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = (+r.score || 0).toFixed(1);
    const rs = document.createElement('span'); rs.className = 'rs';
    rs.textContent = ((RESULTS[r.result] || {}).name || '') + (SOILS[r.soil] ? ' / ' + SOILS[r.soil].name : '');
    li.append(no, nm, sc, rs); list.append(li);
  });
  $('#rankEmpty').hidden = rows.length > 0;
  const lb = $('#legendBox'), ll = $('#legendList');
  if(lb && ll){ lb.hidden = !(legends && legends.length); ll.textContent = (legends || []).slice(0, 30).map(n => '✦ ' + String(n).slice(0,10)).join('   '); }
}
async function api(method, body){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try{
    const r = await fetch('/api/rank', {method, signal: ctl.signal, headers: body ? {'content-type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined});
    let j = null; try{ j = await r.json(); }catch(_){}
    return {status: r.status, data: j};
  }finally{ clearTimeout(t); }
}
async function initRank(){
  renderRank();
  try{
    const {status, data} = await api('GET');
    if(status === 200 && data && Array.isArray(data.rows)){ sharedRows = data.rows; if(Array.isArray(data.legends)) legends = data.legends; renderRank(); }
  }catch(_){}
}
/* 「きこまろ」を名乗る人には本物かどうかを聞く(自己申告のみ) */
const isKiko = n => n.normalize('NFKC').replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s・._-]/g,'').includes('きこまろ');
function askReal(){
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'modal';
    const sh = document.createElement('div'); sh.className = 'sheet'; ov.append(sh);
    const done = v => { ov.remove(); resolve(v); };
    const h = document.createElement('p'); h.className = 'ask'; h.textContent = 'あなたは本物のきこまろですか?';
    const sub = document.createElement('p'); sub.className = 'sub'; sub.textContent = 'この名前をかたる人が増えています。正直にお答えください。';
    const row = document.createElement('div'); row.className = 'row';
    const bReal = document.createElement('button'); bReal.className = 'btn primary'; bReal.textContent = '本物です';
    const bFake = document.createElement('button'); bFake.className = 'btn'; bFake.textContent = '偽物です';
    row.append(bReal, bFake); sh.append(h, sub, row);
    bFake.onclick = () => done(null);
    bReal.onclick = () => done('ok');
    document.body.append(ov);
  });
}
async function register(name, key){
  const entry = {name, score:S.score, result:S.result, soil:S.soil, at:Date.now()};
  const prevLocal = localRows();
  const L = localRows(); L.push(Object.assign({mine:true}, entry)); L.sort((a,b) => b.score - a.score); lsSet(RANK_KEY, L.slice(0,10));
  try{
    const {status, data} = await api('POST', {pid:getPid(), name, score:S.score, result:S.result, soil:S.soil, key});
    if(status === 200 && data && data.ok){
      sharedRows = data.rows; if(Array.isArray(data.legends)) legends = data.legends; renderRank();
      return data.improved
        ? '世界ランキングに登録しました(現在 ' + data.rank + ' 位)'
        : '自己ベスト(' + (+data.best).toFixed(1) + '点・' + data.rank + '位)のほうが上なので、記録はそのままです';
    }
    if(status === 422) return 'その名前は使えません。別の名前で登録してください';
    if(status === 429) return '連続で登録できません。少し待ってからもう一度どうぞ';
  }catch(_){}
  renderRank();
  return '通信できなかったので、この端末にだけ記録しました';
}
function openRank(){ renderRank(); $('#rankM').hidden = false; }
$('#rankOpen').addEventListener('click', openRank);
$('#closeR').addEventListener('click', () => { $('#rankM').hidden = true; });
$('#rankM').addEventListener('click', e => { if(e.target.id === 'rankM') $('#rankM').hidden = true; });

/* ---------- card ---------- */
async function makeCard(){
  try{ await document.fonts.ready; }catch(_){}
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  let g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#bcdde9'); g.addColorStop(.6,'#e6f2f2'); g.addColorStop(.601,'#e4cc98'); g.addColorStop(1,'#c8a66a');
  x.fillStyle = g; x.fillRect(0,0,W,H);
  renderer.render(scene, cam);
  const bs = ballScreen(), src = renderer.domElement, side = bs.r*2.9*DPR;
  x.drawImage(src, bs.x*DPR-side/2, bs.y*DPR-side*.56, side, side, 140, 170, 800, 800);
  x.fillStyle = '#2b1d13'; x.font = '44px "Mochiy Pop One", sans-serif'; x.textBaseline = 'top'; x.fillText('ピカピカ泥団子', 64, 60);
  const R = RESULTS[S.result];
  x.fillStyle = '#fffaf0'; x.strokeStyle = '#2b1d13'; x.lineWidth = 6;
  x.beginPath(); x.roundRect ? x.roundRect(48, 960, W-96, 330, 36) : x.rect(48, 960, W-96, 330); x.fill(); x.stroke();
  x.fillStyle = R.cls === 'rare' ? '#7a3fa0' : R.cls === 'top' ? '#f5c518' : '#2b1d13';
  x.beginPath(); x.roundRect ? x.roundRect(88, 996, 120, 56, 28) : x.rect(88, 996, 120, 56); x.fill();
  x.fillStyle = R.cls === 'top' ? '#3b2c00' : '#ffffff'; x.font = '34px "Mochiy Pop One", sans-serif'; x.textAlign = 'center'; x.fillText(R.tier, 148, 1006);
  x.textAlign = 'left'; x.fillStyle = '#6f5a47'; x.font = '700 32px "Zen Maru Gothic", sans-serif'; x.fillText(SOILS[S.soil].name+'でつくった', 232, 1008);
  x.textAlign = 'right'; x.fillStyle = '#2b1d13'; x.font = '84px "Mochiy Pop One", sans-serif';
  const sw = x.measureText(S.score.toFixed(1)).width; x.fillText(S.score.toFixed(1), W-140, 978);
  x.font = '36px "Mochiy Pop One", sans-serif'; x.fillText('点', W-90, 1020); x.textAlign = 'left';
  void sw;
  let fs = 76; x.font = fs+'px "Mochiy Pop One", sans-serif';
  while(x.measureText(R.name).width > W-180 && fs > 40){ fs -= 4; x.font = fs+'px "Mochiy Pop One", sans-serif'; }
  x.fillStyle = '#2b1d13'; x.fillText(R.name, 88, 1080);
  x.font = '700 38px "Zen Maru Gothic", sans-serif'; x.fillText(R.comment, 88, 1186);
  x.fillStyle = '#2b1d13'; x.font = '700 30px "Zen Maru Gothic", sans-serif'; x.textAlign = 'right'; x.fillText('#ピカピカ泥団子', W-64, 72);
  return c.toDataURL('image/png');
}
async function openCard(){
  const url = await makeCard();
  $('#cardImg').src = url; $('#modal').hidden = false;
}
$('#closeM').addEventListener('click', () => { $('#modal').hidden = true; });
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') $('#modal').hidden = true; });

/* ---------- loop ---------- */
let last = performance.now(), sparkleT = 0;
const _q = new THREE.Quaternion(), _f = new THREE.Vector3();
function loop(t){
  const dt = Math.min(.05, (t-last)/1000); last = t;
  const c = ballScreen();
  if(S.step === 0 && !down) ball.rotateOnWorldAxis(AY, dt*.35);
  if(S.step === 3){
    ball.rotateOnWorldAxis(AY, dt*SAND_SPIN);
    if(S.holding){
      _q.copy(ball.quaternion).invert(); _f.set(0,0,1).applyQuaternion(_q);
      let u = Math.atan2(_f.z, -_f.x)/(Math.PI*2); u = (u%1+1)%1;
      const i = Math.floor(u*12)%12;
      S.sand[i] = Math.min(2.4, S.sand[i] + 1.0*dt);
      S.sand[(i+1)%12] = Math.min(2.4, S.sand[(i+1)%12] + .2*dt);
      S.sand[(i+11)%12] = Math.min(2.4, S.sand[(i+11)%12] + .2*dt);
      texDirty = true;
      for(let k=0;k<5;k++) spawn({x:c.x+(Math.random()-.5)*c.r*.8, y:c.y-c.r*2-Math.random()*30, vy:80, g:700, size:2+Math.random()*2, decay:.2,
        color:Math.random()<.5 ? '#efdcb0' : '#c9a96c', stopY:c.y-c.r*.75+Math.random()*c.r*.3});
    }
    const bars = document.querySelectorAll('#bars i');
    bars.forEach((b,i) => { b.style.height = Math.max(2, Math.min(28, S.sand[i]/1.6*28))+'px'; b.classList.toggle('over', S.sand[i] > 1.6); });
  }
  if(S.step === 5 && !S.polishStarted && S.t5) setSky((performance.now() - S.t5)/180000);
  if(S.step === 4){
    S.dry += dt/6;
    const lowWater = S.water < .55 - 2.2*sl().tol;
    let cr = lowWater ? clamp((S.dry-.4)*1.5, 0, 1) : 0;
    if(S.dry > 1.6) cr = Math.max(cr, clamp((S.dry-1.6)*1.5, 0, 1));
    if(Math.abs(cr - S.crack) > .02){ S.crack = cr; texDirty = true; }
    const m4 = $('#m4'), s4 = $('#s4');
    if(m4) m4.style.width = Math.min(100, S.dry/2.2*100)+'%';
    if(s4) s4.textContent = S.dry < .4 ? 'まだやわらかい' : S.dry < .85 ? 'かたまってきた' : S.dry < 1.25 ? 'いい感じ…かも' : S.dry < 1.6 ? 'けっこう乾いた' : 'カラカラ…';
    if(S.dry >= 2.2){ toast('乾かしすぎた…'); goStep(5); }
  }
  if((S.step === 5 || S.step === 0 || S.step === 6) && !down && (Math.abs(vx) > .05 || Math.abs(vy) > .05)){ spin(vx, vy); vx *= INERTIA; vy *= INERTIA; }
  if(S.step === 6){
    if(S.result === 'mud'){
      S.mudT = Math.min(1, S.mudT + dt*1.4); const e = 1 - Math.pow(1-S.mudT, 3);
      ball.scale.set(1+e*.8, 1-e*.8, 1+e*.8); ball.position.y = ball.scale.y - 1;
    } else if(!down && Math.abs(vx) < .3) ball.rotateOnWorldAxis(AY, dt*.4);
    if(S.result === 'mirror' || S.result === 'black' || S.result === 'maboroshi'){
      sparkleT -= dt;
      if(sparkleT <= 0){ sparkleT = (S.result === 'mirror' || S.result === 'maboroshi') ? .18 : .5;
        const a = Math.random()*Math.PI*2, rr = Math.random()*c.r*.8;
        spawn({type:'star', x:c.x+Math.cos(a)*rr, y:c.y+Math.sin(a)*rr, size:6+Math.random()*8, decay:1.4, color:'#ffffff'}); }
    }
  }
  if(shapeDirty && S.step !== 6){ shape('lump', S.lump); shapeDirty = false; }
  if(texDirty && t - texLast > 80){ drawTex(); texDirty = false; texLast = t; }
  look();
  if(S.step === 6 && S.result === 'mud'){ ball.position.y = ball.scale.y - 1; }
  renderer.render(scene, cam);
  drawFx(dt);
  requestAnimationFrame(loop);
}

/* ---------- start ---------- */
resize();
drawTex();
const m = /^#r(\d+)$/.exec(location.hash || '');
const FORCED = [188.0, 97.8, 88.4, 74.2, 58.6, 52.1, 41.3, 27.9, 19.5, 3.2, 11.7, 14.6];
if(m && RESULT_ORDER[+m[1]]){ S.soil = 'black'; S.round = 80; showResult(RESULT_ORDER[+m[1]], FORCED[+m[1]]); }
else goStep(0);
initRank();
requestAnimationFrame(loop);
})();
