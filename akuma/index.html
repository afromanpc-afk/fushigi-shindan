<style>
/* Layout: one narrow column like a grimoire page; each screen is a single "leaf" swapped in place. Deliberately single dark theme. */
:root{
  --bg:#0f0b15; --panel:#18121f; --line:#2c2236; --fg:#ece3d3; --muted:#a093ab; --gold:#c9a45c; --gold-dim:#7d6638;
  --demon:#c9a45c;
  --display:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.8;padding-inline:16px;padding-block:24px 48px;padding-top:max(24px,env(safe-area-inset-top));
  background-image:radial-gradient(ellipse at 50% -10%,rgba(201,164,92,.10),transparent 60%),radial-gradient(ellipse at 50% 110%,rgba(120,40,90,.12),transparent 60%);background-attachment:fixed}
.top{max-width:560px;margin:0 auto 14px}
.toplink{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:.1em}
.toplink:hover{color:var(--fg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.04em}
p{margin:0}
button,a.btn{font-family:var(--body);cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--gold);text-align:center}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold-dim);font-size:12px;letter-spacing:.2em;justify-content:center}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}

/* intro */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hero h1{font-size:clamp(34px,9vw,48px);line-height:1.25}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lede{color:var(--muted);max-width:30em}
.cta{appearance:none;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(201,164,92,.18),rgba(201,164,92,.06));color:var(--fg);
  font-size:17px;letter-spacing:.15em;padding:14px 40px;border-radius:2px;transition:background .2s,transform .2s}
.cta:hover{background:rgba(201,164,92,.28)}
.cta:active{transform:translateY(1px)}
.meta{font-size:12px;color:var(--muted);letter-spacing:.1em}
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.roster button{appearance:none;border:1px solid var(--line);background:var(--panel);padding:6px 4px 8px;border-radius:2px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;line-height:1.3;transition:border-color .2s,color .2s}
.roster button:hover{border-color:var(--gold-dim);color:var(--fg)}
.roster svg{width:100%;height:auto;display:block}
@media (max-width:420px){.roster{grid-template-columns:repeat(5,1fr);gap:5px}.roster button{font-size:9.5px;padding:4px 2px 6px}}

/* quiz */
.progress{display:flex;flex-direction:column;gap:10px}
.progress .count{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.15em;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width .4s ease}
.qnum{font-family:var(--display);font-size:13px;color:var(--gold);letter-spacing:.3em}
.qtext{font-size:clamp(21px,5.4vw,26px);line-height:1.6;margin-top:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:15.5px;line-height:1.6;

.opt:hover{border-color:var(--gold-dim);background:#1e1727}
.opt .k{font-family:var(--display);color:var(--gold);font-size:14px;flex:none;width:1.2em}
.opt.picked{border-color:var(--gold);background:#251c2d}
.back{appearance:none;background:none;border:none;color:var(--muted);font-size:13px;align-self:flex-start;padding:4px 0;letter-spacing:.1em}
.back:hover{color:var(--fg)}

.ritual{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:40px;text-align:center}
.ritual svg{width:180px;height:180px;animation:spin 6s linear infinite}
.ritual p{color:var(--muted);letter-spacing:.2em;font-size:13px}

.card{border:1px solid var(--gold-dim);background:linear-gradient(180deg,#1b1422,#130e19);padding:22px 20px 26px;border-radius:2px;position:relative;

.rtop{text-align:center;display:flex;flex-direction:column;gap:6px}
.rtop .you{font-size:12px;letter-spacing:.3em;color:var(--muted)}
.rtop .sin{font-size:12px;letter-spacing:.25em;color:var(--demon)}
.rtop h2{font-size:clamp(34px,9vw,44px);line-height:1.2}
.rtop .title{font-family:var(--display);font-size:17px;color:var(--demon)}
.lead{font-size:17px;line-height:1.75;text-align:center;font-weight:500;text-wrap:balance;word-break:auto-phrase}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:15px;color:var(--gold);letter-spacing:.15em;display:flex;align-items:center;gap:10px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec p{color:#ddd3c4}
.aru{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.aru li{display:flex;gap:10px;align-items:baseline}
.aru li::before{content:"✓";color:var(--demon);font-size:13px;flex:none}
.mix{display:flex;flex-direction:column;gap:8px}
.mix .row{display:grid;grid-template-columns:7.5em 1fr 3em;gap:10px;align-items:center;font-size:13.5px}
.mix .row b{font-weight:500}
.mix .row span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.mix .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.mix .track i{display:block;height:100%;border-radius:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--fg);border-radius:2px;padding:10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px;line-height:1.5}
.pair button:hover{border-color:var(--gold-dim)}
.pair .lbl{color:var(--muted);letter-spacing:.15em;font-size:11px}
.pair .nm{font-family:var(--display);font-size:17px}
.pair .why{color:var(--muted)}
.contract{border-top:1px solid var(--line);padding-top:16px;text-align:center;font-family:var(--display);font-size:16px;color:var(--demon);line-height:1.8}
.contract small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:4px}
.actions{display:flex;flex-direction:column;gap:10px}
.share{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:700;
  padding:14px;border-radius:2px;letter-spacing:.08em;font-size:15px}
.share:hover{background:#fff}
.ghost{appearance:none;border:1px solid var(--line);background:none;color:var(--fg);padding:12px;border-radius:2px;font-size:14px;letter-spacing:.1em}
.ghost:hover{border-color:var(--gold-dim)}
.note{font-size:11.5px;color:var(--muted);text-align:center}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.portrait .eye{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function question(){
  const q=Q[step];
  app.innerHTML=`<div class="progress fade"><div class="count"><span>QUESTION</span><span>${step+1} / ${Q.length}</span></div><div class="bar"><i style="width:${step/Q.length*100}%"></i></div></div>
  <div class="fade"><p class="qnum">第${["一","二","三","四","五","六","七","八","九","十"][step]}の問い</p><h2 class="qtext">${esc(q.q)}</h2></div>
  <div class="opts fade">${q.o.map((o,i)=>`<button class="opt${answers[step]===i?" picked":""}" data-i="${i}"><span class="k">${"壱弐参肆"[i]}</span><span>${esc(o[0])}</span></button>`).join("")}</div>
  ${step>0?`<button class="back" id="back">← 前の問いに戻る</button>`:""}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[step]=+b.dataset.i; b.classList.add("picked");
    setTimeout(()=>{ if(step<Q.length-1){step++;question();} else ritual(); },180);
  });
  const bk=document.getElementById("back"); if(bk) bk.onclick=()=>{step--;question();};
  scrollTo(0,0);
}

function score(){
  const s={}; ORDER.forEach(t=>s[t]=0);
  answers.forEach((a,i)=>{const w=Q[i].o[a][1];for(const k in w)s[k]+=w[k];});
  const n={}; ORDER.forEach(t=>n[t]=s[t]/Math.sqrt(MAX[t])+s[t]*0.001);
  const rank=ORDER.slice().sort((a,b)=>n[b]-n[a]);
  const top=rank.slice(0,3), sum=top.reduce((x,t)=>x+n[t],0)||1;
  let pct=top.map(t=>Math.round(n[t]/sum*100)); pct[0]+=100-pct.reduce((a,b)=>a+b,0);
  return {top,pct};
}

function ritual(){
  const r=score();
  app.innerHTML=`<div class="ritual fade"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#c9a45c" stroke-width=".8"/><circle cx="50" cy="50" r="38" fill="none" stroke="#c9a45c" stroke-width=".5" stroke-dasharray="1 3"/><path d="M50 8 L74 82 L12 36 L88 36 L26 82Z" fill="none" stroke="#c9a45c" stroke-width="1"/></svg><p>魂の形を読み取っています</p></div>`;
  scrollTo(0,0);
  setTimeout(()=>showResult(r.top[0],r,false),1700);
}

  </article>
  <div class="actions">
    ${mine?`<a class="share" href="${shareHref(k)}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>結果をXでシェア</a>`:""}
    <button class="ghost" id="again">${mine?"もう一度診断する":"自分の悪魔を診断する"}</button>
  </div>
  <div class="rule">ほかの悪魔を見る</div>
  <div class="roster">${ORDER.map(x=>`<button data-k="${x}" aria-label="${D[x].name}の解説を見る">${portrait(x,{small:true})}<span>${D[x].name}</span></button>`).join("")}</div>
  <p class="note">この診断はエンターテインメントです。</p>`;
  const myR=r;
  app.querySelectorAll(".roster button,.pair button").forEach(b=>b.onclick=()=>showResult(b.dataset.k,null,true));
  document.getElementById("again").onclick=()=>{ if(mine){step=0;answers=[];question();} else intro(); };
  scrollTo(0,0);
}

/* 共有リンクから来た人: #lucifer などで結果を表示 */
const h=(location.hash||"").slice(1);
const fromHash=ORDER.find(k=>D[k].id===h);
if(fromHash) showResult(fromHash,null,false); else intro();
</script>
