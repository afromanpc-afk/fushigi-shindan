/* ===== アフロの絵(SVG) ===== */
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function puff(cx,cy,rx,ry,n,br,fill,seed,stroke="#2b1a12"){
  const r=rng(seed);let out="";
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,j=.86+r()*.18;
    out+=`<circle cx="${(cx+Math.cos(a)*rx*j).toFixed(1)}" cy="${(cy+Math.sin(a)*ry*j).toFixed(1)}" r="${(br*(.8+r()*.4)).toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;}
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,j=.86+r()*.18;
    out+=`<circle cx="${(cx+Math.cos(a)*rx*j).toFixed(1)}" cy="${(cy+Math.sin(a)*ry*j).toFixed(1)}" r="${(br*.8).toFixed(1)}" fill="${fill}"/>`;}
  out+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx*.93}" ry="${ry*.93}" fill="${fill}"/>`;
  return out;
}
function curls(cx,cy,rx,ry,n,col,seed){const r=rng(seed);let o="";for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.sqrt(r())*.8;
  const x=cx+Math.cos(a)*rx*d,y=cy+Math.sin(a)*ry*d;o+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} a4 4 0 1 1 6 3" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>`}return o}

/* ===== 判定 ===== */
let step=0,answers=[];
function judge(){
  const s={A:0,B:0,C:0},tot={A:0,B:0,C:0},pos={A:0,B:0,C:0};
  answers.forEach((a,i)=>{const w=Q[i].o[a][1];for(const ax in w){s[ax]+=w[ax];tot[ax]+=Math.abs(w[ax]);if(w[ax]>0)pos[ax]+=w[ax];}});
  const code=(s.A>0?"+":"-")+(s.B>0?"+":"-")+(s.C>0?"+":"-");
  const secret=answers.every((a,i)=>!Q[i].o.some(o=>o[2])||Q[i].o[a][2]===1);
  const pct={A:Math.round(pos.A/tot.A*100),B:Math.round(pos.B/tot.B*100),C:Math.round(pos.C/tot.C*100)};
  return {key:secret?"saito":TYPES[code],pct};
}

  ${step>0?`<button class="back" id="back">← ひとつ前に戻る</button>`:""}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.i;b.classList.add("picked");
    setTimeout(()=>{if(step<Q.length-1){step++;ask()}else loading()},170)});

  app.innerHTML=`<a class="toplink" href="../">← 診断一覧へ</a>
  <article class="card fade">
    <div class="rtop">${t.secret?`<span class="secret">SECRET TYPE</span>`:""}<p class="you">${mine?"あなたは……":shared?"この人のアフロは……":"アフロ図鑑"}</p><h2>${t.name}</h2><span class="nick">${t.nick}</span></div>
    <div class="portrait">${afro(k)}</div>
    <p class="catch">${t.catch}</p>
    ${axes}
    <div class="sec"><h3>どんな人?</h3><p>${t.body}</p></div>
    <div class="sec"><h3>あるある</h3><ul class="aru">${t.aru.map(a=>`<li>${a}</li>`).join("")}</ul></div>
    <div class="sec"><h3>恋愛</h3><p>${t.love}</p></div>
    <div class="sec"><h3>才能</h3><p>${t.gift}</p></div>
    <div class="sec"><h3>ひとことアドバイス</h3><p>${t.warn}</p></div>
    <div class="sec"><h3>相性</h3><div class="pair">${pair(t.best,"最高の相棒")}${pair(t.rival,"ライバル")}</div></div>
    <p class="quote"><small>アフロ語録</small>「${t.quote}」</p>
  </article>
  <div class="actions">
    ${mine?`<a class="share" href="${shareHref(k)}" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>結果をXでシェア</a>
    <button class="ghost" id="copy">結果のリンクをコピー</button><p class="toast" id="toast" hidden></p>`:""}
    <button class="ghost" id="again">${mine?"もう一度診断する":"自分のアフロを診断する"}</button>
  </div>
  <p class="label">ほかのアフロも見る</p>${roster()}
  <p class="note">この診断はエンターテインメントです。</p>`;
  bindRoster();
  app.querySelectorAll(".pair button").forEach(b=>b.onclick=()=>result(b.dataset.k,null));
  document.getElementById("again").onclick=()=>{step=0;answers=[];if(mine)ask();else intro()};
  const cp=document.getElementById("copy");
  if(cp)cp.onclick=()=>{const u=shareURL(k),ts=document.getElementById("toast");
    const ok=()=>{ts.hidden=false;ts.textContent="コピーしました"};
    try{navigator.clipboard.writeText(u).then(ok,()=>{ts.hidden=false;ts.textContent=u})}catch(e){ts.hidden=false;ts.textContent=u}};
  scrollTo(0,0);
}

const h=(location.hash||"").slice(1);
if(T[h]) result(h,null,true); else intro();
</script>
</body>
</html>
